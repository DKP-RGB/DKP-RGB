<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>

    <pattern id="scanPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000"/>
      <rect y="2" width="4" height="2" fill="#020602"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="900" height="280" rx="10"/>
    </clipPath>

    <style>
      .matrix-rain {
        font-family: Consolas, 'Courier New', monospace;
        font-size: 11px;
        fill: #00ff41;
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: -2px;
      }
      .r-fast { animation: fall 3.5s linear infinite; opacity: 0.35; }
      .r-med  { animation: fall 5.5s linear infinite; opacity: 0.25; }
      .r-slow { animation: fall 8s linear infinite; opacity: 0.15; }

      @keyframes fall {
        0%   { transform: translateY(-260px); }
        100% { transform: translateY(300px); }
      }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- Background -->
    <rect x="0" y="0" width="900" height="280" fill="#000000"/>

    <!-- Faint circuit grid -->
    <g opacity="0.5">
      <line x1="0" y1="60"  x2="900" y2="60"  stroke="#063311" stroke-width="1"/>
      <line x1="0" y1="120" x2="900" y2="120" stroke="#063311" stroke-width="1"/>
      <line x1="0" y1="180" x2="900" y2="180" stroke="#063311" stroke-width="1"/>
      <line x1="0" y1="240" x2="900" y2="240" stroke="#063311" stroke-width="1"/>
      <line x1="150" y1="0" x2="150" y2="280" stroke="#063311" stroke-width="1"/>
      <line x1="300" y1="0" x2="300" y2="280" stroke="#063311" stroke-width="1"/>
      <line x1="450" y1="0" x2="450" y2="280" stroke="#063311" stroke-width="1"/>
      <line x1="600" y1="0" x2="600" y2="280" stroke="#063311" stroke-width="1"/>
      <line x1="750" y1="0" x2="750" y2="280" stroke="#063311" stroke-width="1"/>
      <circle cx="150" cy="60"  r="2" fill="#0a4a1c"/>
      <circle cx="450" cy="120" r="2" fill="#0a4a1c"/>
      <circle cx="600" cy="180" r="2" fill="#0a4a1c"/>
      <circle cx="300" cy="240" r="2" fill="#0a4a1c"/>
      <circle cx="750" cy="60"  r="2" fill="#0a4a1c"/>
    </g>

    <!-- Animated Matrix Digital Rain Layer -->
    <g>
      <text class="matrix-rain r-fast" x="30" y="0">101001101010110</text>
      <text class="matrix-rain r-slow" x="80" y="-100">0x410x490x4d0x4c</text>
      <text class="matrix-rain r-med"  x="180" y="-50">110100101110010</text>
      <text class="matrix-rain r-fast" x="250" y="-120">01001000010010</text>
      <text class="matrix-rain r-slow" x="350" y="-80">0xDE0xAD0xBE0xEF</text>
      <text class="matrix-rain r-med"  x="420" y="-140">100111010010110</text>
      <text class="matrix-rain r-fast" x="520" y="-30">01010011010101</text>
      <text class="matrix-rain r-slow" x="620" y="-110">110101001110101</text>
      <text class="matrix-rain r-med"  x="700" y="-60">0x000xFF0x000x41</text>
      <text class="matrix-rain r-fast" x="780" y="-130">101011100101001</text>
      <text class="matrix-rain r-slow" x="860" y="-20">01101001010011</text>
    </g>

    <!-- Scanlines -->
    <rect x="0" y="0" width="900" height="280" fill="url(#scanPattern)" opacity="0.4"/>

    <!-- Vignette -->
    <rect x="0" y="0" width="900" height="280" fill="url(#vignetteGrad)"/>

    <!-- Panel behind text for readability -->
    <rect x="70" y="72" width="560" height="150" rx="6" fill="#000000" opacity="0.65"/>

    <!-- Terminal title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#060a06"/>
    <circle cx="24" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="44" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="5" fill="#27c93f"/>
    <text x="450" y="21" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#3fff6b" opacity="0.6">root@localhost: ~/portfolio DKP-RGB</text>

    <!-- Main name with glitch layers -->
    <text x="99" y="130" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#ff0055" opacity="0">
      YOUR_NAME
      <animate attributeName="opacity" values="0;0;0.7;0;0;0.6;0;0" keyTimes="0;0.94;0.95;0.96;0.97;0.98;0.99;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="101" y="130" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#00e5ff" opacity="0">
      YOUR_NAME
      <animate attributeName="opacity" values="0;0;0.6;0;0;0.5;0;0" keyTimes="0;0.93;0.95;0.96;0.97;0.98;0.99;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="100" y="130" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#00ff41" filter="url(#glow)">
      DEVANSH KUMAR PATIDAR
      <animate attributeName="opacity" values="1;1;0.7;1;0.4;1" keyTimes="0;0.92;0.93;0.94;0.95;1" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- Terminal Step-Blink Cursor -->
    <rect x="650" y="93" width="14" height="38" fill="#00ff41">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Typed command line -->
    <text x="100" y="163" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#3fff6b">
      <tspan fill="#00ff41">$</tspan> DKP-RGB
    </text>
    <text x="100" y="188" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4a9a5a">
      B.Tech AI &amp; ML &#183; Symbiosis University of Applied Sciences &#183; Backend &amp; Systems
    </text>

    <!-- Tag pills -->
    <rect x="100" y="205" width="90"  height="22" rx="4" fill="#031a06" stroke="#00ff41" stroke-width="0.8"/>
    <rect x="198" y="205" width="80"  height="22" rx="4" fill="#031a06" stroke="#00ff41" stroke-width="0.8"/>
    <rect x="286" y="205" width="100" height="22" rx="4" fill="#031a06" stroke="#00ff41" stroke-width="0.8"/>
    <rect x="394" y="205" width="90"  height="22" rx="4" fill="#031a06" stroke="#00ff41" stroke-width="0.8"/>

    <text x="145" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00ff41">Python</text>
    <text x="238" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00ff41">C++</text>
    <text x="336" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00ff41">Hackathon</text>
    <text x="439" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00ff41">Open Source</text>

    <!-- Bottom status bar -->
    <rect x="0" y="268" width="900" height="4" fill="#0a0f0a"/>
    <rect x="0" y="268" width="900" height="4" fill="#00ff41" opacity="0.8">
      <animateTransform attributeName="transform" type="scale" values="0,1; 1,1; 1,1" keyTimes="0;0.3;1" dur="2s" fill="freeze" additive="replace"/>
    </rect>
    <text x="100" y="256" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#2a6a3a">[ system online ] [ access: granted ] [ uptime: 99.98% ]</text>

    <!-- Border -->
    <rect x="1" y="1" width="898" height="278" rx="10" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.35"/>
  </g>
</svg>
